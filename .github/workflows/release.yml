# Publishes a release when VERSION changes on main (or when run by hand).
# The workflow creates the tag v<VERSION> itself; if that release already
# exists, it does nothing. deploy/install.sh downloads upkeeper_linux_<arch>,
# checksums.txt (and install.sh itself) from the latest release.
name: Release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.v.outputs.tag }} already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: steps.exists.outputs.skip != 'true'
        run: go vet ./... && go test ./...
      - if: steps.exists.outputs.skip != 'true'
        run: make build VERSION=${{ steps.v.outputs.tag }}
      - if: steps.exists.outputs.skip != 'true'
        name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            bin/upkeeper_linux_amd64 bin/upkeeper_linux_arm64 bin/checksums.txt deploy/install.sh \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --generate-notes
