# Creates a DRAFT release when VERSION changes on main (or when run by hand).
# The workflow creates the tag v<VERSION> itself; if that release already
# exists, it does nothing. A draft is not "latest", so installers don't see
# it until the founder signs checksums.txt offline, uploads
# checksums.txt.sig and publishes it (docs/RELEASING.md). deploy/install.sh
# refuses releases without a valid signature.
name: Release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.v.outputs.tag }} already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: steps.exists.outputs.skip != 'true'
        run: go vet ./... && go test ./...
      - if: steps.exists.outputs.skip != 'true'
        env:
          ROOT_KEYS: ${{ vars.UPKEEPER_ROOT_KEYS }}
        run: |
          if [ -z "$ROOT_KEYS" ]; then
            echo "::warning::UPKEEPER_ROOT_KEYS is not set: this build accepts no jobs."
          fi
          make build VERSION=${{ steps.v.outputs.tag }} ROOT_KEYS="$ROOT_KEYS"
      - if: steps.exists.outputs.skip != 'true'
        name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            bin/upkeeper_linux_amd64 bin/upkeeper_linux_arm64 bin/checksums.txt deploy/install.sh \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --generate-notes --draft
